<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Página demonstrativa sobre equipamentos profissionais para banho e tosa, secadores, sopradores e acessórios pet.">
<title>Equipamentos Pet | Banho e Tosa Profissional</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --blue: #173a5b;
  --blue2: #245a85;
  --yellow: #f6bd38;
  --light: #f4f8fb;
  --text: #263645;
  --muted: #6b7782;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
}
h1,h2,h3,h4 {
  font-family: 'Montserrat', sans-serif;
}
a { text-decoration: none; }
.topbar {
  background: var(--blue);
  color: white;
  padding: 10px;
  text-align: center;
  font-size: 11px;
  letter-spacing: .7px;
}
.navbar {
  background: white;
  padding: 16px 0;
  box-shadow: 0 2px 14px rgba(0,0,0,.05);
}
.brand {
  font-size: 25px;
  font-weight: 800;
  color: var(--blue);
  letter-spacing: -1px;
}
.brand span { color: #e3a921; }
.brand small {
  display: block;
  font-size: 9px;
  letter-spacing: 2px;
  font-weight: 600;
}
.nav-link {
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  margin: 0 7px;
}
.nav-link:hover { color: var(--blue2); }
.btn-main {
  display: inline-block;
  background: var(--yellow);
  border: 1px solid var(--yellow);
  color: #1d3040;
  padding: 14px 25px;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .5px;
  transition: .25s;
}
.btn-main:hover {
  background: #e4a820;
  border-color: #e4a820;
  color: #1d3040;
}
.btn-outline {
  display: inline-block;
  padding: 13px 24px;
  border: 1px solid white;
  color: white;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}
.btn-outline:hover { background: white; color: var(--blue); }
.hero {
  min-height: 590px;
  display: flex;
  align-items: center;
  color: white;
  background:
    linear-gradient(90deg,rgba(10,36,61,.9),rgba(10,36,61,.24)),
    url('https://images.unsplash.com/photo-1516734212186-a967f81ad0d7?auto=format&fit=crop&w=1900&q=85')
    center/cover no-repeat;
}
.hero-content { max-width: 690px; padding: 80px 0; }
.tag {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.hero h1 {
  font-size: clamp(38px,5vw,64px);
  line-height: 1.13;
  margin: 20px 0;
}
.hero p {
  color: #e7edf2;
  font-size: 15px;
  line-height: 1.9;
  max-width: 540px;
}
.benefits { background: var(--light); padding: 25px 0; }
.benefit {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  padding: 12px;
}
.benefit i { font-size: 28px; color: var(--blue2); }
.benefit strong { display: block; font-size: 12px; }
.benefit small { color: var(--muted); font-size: 11px; }
.section { padding: 85px 0; }
.section-title {
  text-align: center;
  max-width: 700px;
  margin: 0 auto 45px;
}
.section-title .tag { color: var(--blue2); }
.section-title h2 {
  font-size: clamp(28px,4vw,43px);
  margin: 16px 0;
}
.section-title p {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.8;
}
.category {
  display: block;
  position: relative;
  overflow: hidden;
  background: #dce5ed;
}
.category img {
  width: 100%;
  height: 305px;
  object-fit: cover;
  transition: .5s;
}
.category:hover img { transform: scale(1.05); }
.category::after {
  content: "";
  position: absolute;
  inset: 35% 0 0;
  background: linear-gradient(transparent,rgba(0,0,0,.75));
}
.category-info {
  position: absolute;
  z-index: 1;
  bottom: 22px;
  left: 23px;
  color: white;
}
.category-info h3 { font-size: 24px; }
.category-info span { font-size: 11px; text-transform: uppercase; }
.soft { background: var(--light); }
.feature-img { width: 100%; height: 470px; object-fit: cover; }
.feature-copy { padding: 45px 8%; }
.feature-copy h2 { font-size: clamp(30px,4vw,45px); margin: 20px 0; }
.feature-copy p { font-size: 14px; color: var(--muted); line-height: 1.9; }
.product {
  border: 1px solid #e6ebef;
  background: white;
  height: 100%;
  transition: .25s;
}
.product:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 28px rgba(0,0,0,.07);
}
.product img {
  width: 100%;
  height: 235px;
  object-fit: cover;
}
.product-body { padding: 22px; }
.product-body h3 { font-size: 19px; line-height: 1.4; }
.product-body p {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.8;
}
.product-body a {
  font-size: 11px;
  font-weight: 800;
  color: var(--blue2);
  text-transform: uppercase;
}
.banner {
  padding: 100px 0;
  color: white;
  background:
    linear-gradient(90deg,rgba(13,43,70,.88),rgba(13,43,70,.2)),
    url('https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=1800&q=85')
    center/cover no-repeat;
}
.banner h2 { font-size: clamp(33px,4vw,50px); max-width: 650px; margin: 20px 0; }
.banner p { max-width: 530px; line-height: 1.9; }
.info-icon {
  width: 58px; height: 58px;
  display: grid; place-items: center;
  background: #e7f0f7;
  color: var(--blue2);
  font-size: 26px;
  border-radius: 50%;
  margin-bottom: 20px;
}
.info-card h3 { font-size: 21px; }
.info-card p { color: var(--muted); font-size: 13px; line-height: 1.8; }
.cta { padding: 75px 0; background: var(--blue); color: white; text-align: center; }
.cta h2 { font-size: clamp(29px,4vw,43px); }
.cta p { max-width: 650px; margin: 20px auto; color: #dce6ef; line-height: 1.8; }
.footer { background: #102a40; color: white; padding: 55px 0 20px; }
.footer .brand { color: white; }
.footer h4 { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 18px; }
.footer p,.footer a { color: #c7d5df; font-size: 12px; line-height: 2; }
.footer a:hover { color: white; }
.footer-bottom {
  border-top: 1px solid #3d5365;
  margin-top: 35px;
  padding-top: 20px;
  color: #bbcedb;
  font-size: 11px;
}
@media(max-width:767px) {
  .hero { min-height: 510px; }
  .hero-content { padding: 65px 10px; }
  .section { padding: 60px 0; }
  .category img { height: 265px; }
  .feature-img { height: 310px; }
  .feature-copy { padding: 40px 25px; }
  .product img { height: 210px; }
  .banner { padding: 70px 0; }
}
</style>
</head>
